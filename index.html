<!DOCTYPE html>
<html lang="it">
<head>
    <meta property="og:title" content="Sfida Tris Pro">
    <meta property="og:description" content="Riuscirai a battere la mia IA imbattibile? Prova il mio gioco di Tris dal design sofisticato.">
    <meta property="og:type" content="website">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tris Game </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-gradient"></div>
    
    <div class="main-card">
        <header>
            <h1>Tris Game <span>Pro</span></h1>
            <div class="score-container">
                <div class="score-item">
                    <span class="label">Player X</span>
                    <span id="score-x" class="value">0</span>
                </div>
                <div class="score-divider"></div>
                <div class="score-item">
                    <span class="label">Draws</span>
                    <span id="score-draws" class="value">0</span>
                </div>
                <div class="score-divider"></div>
                <div class="score-item">
                    <span id="label-o" class="label">AI</span>
                    <span id="score-o" class="value">0</span>
                </div>
            </div>
        </header>

        <div class="game-settings">
            <select id="gameMode">
                <option value="pvc">Solo (VS AI)</option>
                <option value="pvp">Multiplayer</option>
            </select>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="hard">Expert</option>
            </select>
            <select id="theme">
                <option value="classic">Minimal</option>
                <option value="emoji">Emoji</option>
                <option value="space">Galaxy</option>
            </select>
        </div>

        <div id="status" class="status-badge">Tocca a: <span id="player-symbol">X</span></div>
        
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="footer-actions">
            <button id="restart" class="btn-primary">Next Round</button>
            <button id="reset-scores" class="btn-ghost">Reset All</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
